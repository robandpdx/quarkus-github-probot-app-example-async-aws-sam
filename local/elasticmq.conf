include classpath("application.conf")

node-address {
  protocol = http
  host = "localhost"
  port = 9324
  context-path = ""
}

queues {
  github-webhooks {
    defaultVisibilityTimeout = 540 seconds
    deadLettersQueue {
      name = "github-webhooks-dlq"
      maxReceiveCount = 5
    }
  }
  github-webhooks-dlq {}
}
